# Fill in plaintext values under stringData — Kubernetes will base64-encode them.
#
# Required:
#   OPENCLAW_GATEWAY_TOKEN — token used to authenticate with the Control UI
#
# Optional (populate alongside the corresponding feature flag in configmap-env.yaml):
#   NGROK_AUTHTOKEN         — required when ENABLE_NGROK=true
#   TS_AUTHKEY              — required when TAILSCALE_ENABLE=true
#   RESTIC_SPACES_ACCESS_KEY_ID / RESTIC_SPACES_SECRET_ACCESS_KEY / RESTIC_PASSWORD
#                           — required when ENABLE_SPACES=true
#   GRADIENT_API_KEY        — optional AI model provider key
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: "REPLACE_ME"
  NGROK_AUTHTOKEN: ""
  TS_AUTHKEY: ""
  RESTIC_SPACES_ACCESS_KEY_ID: ""
  RESTIC_SPACES_SECRET_ACCESS_KEY: ""
  RESTIC_PASSWORD: ""
  GRADIENT_API_KEY: ""
