apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Uncomment and set storageClassName if your cluster has no default StorageClass,
  # or if you want to use a specific one (e.g., "standard", "gp2", "do-block-storage").
  # storageClassName: ""
