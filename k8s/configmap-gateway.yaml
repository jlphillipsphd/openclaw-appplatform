# Overrides /etc/openclaw/openclaw.default.json inside the container.
# The key change from the upstream default is "bind": "all" (was "loopback"),
# which is required for the Kubernetes Service to route traffic to the gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-gateway-config
  namespace: openclaw
data:
  openclaw.default.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "all",
        "controlUi": {
          "allowInsecureAuth": true
        }
      },
      "plugins": {
        "enabled": true,
        "entries": {
          "whatsapp": { "enabled": true },
          "telegram": { "enabled": true },
          "signal":   { "enabled": true },
          "discord":  { "enabled": true }
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "gradient": {
            "baseUrl": "https://inference.do-ai.run/v1",
            "apiKey": "${GRADIENT_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "llama3.3-70b-instruct",
                "name": "Llama 3.3 70B Instruct",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 8192
              },
              {
                "id": "deepseek-r1-distill-llama-70b",
                "name": "DeepSeek R1 Distill Llama 70B",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 8192
              },
